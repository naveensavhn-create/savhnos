version: "3.9"

# Local development convenience only — production uses Neon PostgreSQL and a
# single `git push` deploy to Vercel. This is not part of the deployment path.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: savhnos
      POSTGRES_PASSWORD: savhnos
      POSTGRES_DB: savhnos
    ports:
      - "5432:5432"
    volumes:
      - savhnos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savhnos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  savhnos_pg_data:
